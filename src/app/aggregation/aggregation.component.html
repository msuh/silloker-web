<div class="outer-container">
      <div class="title">
        <h2>AGGREGATION</h2>
     </div>
     <ng-template [ngIf]="errorMessage">
        <div>
          <div class="alert alert-warning" role="alert">
            {{errorMessage}}
          </div>
        </div>
      </ng-template>
      <div>
        <app-record-type-selector (recordSelectEvent)="recordTypeChanged($event)"></app-record-type-selector>
        
        <mat-form-field class="wide-input-field">
          <mat-chip-list #chipList aria-label="aggregation-input">
            <mat-chip *ngFor="let input of keywordInputs" [selectable]="selectable"
                     [removable]="removable" (removed)="removeKeywordInput(input)">
              {{input}}
              <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
            </mat-chip>
            <input placeholder="keyword to graph"
                   [matChipInputFor]="chipList"
                   [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                   [matChipInputAddOnBlur]="addOnBlur"
                   (matChipInputTokenEnd)="addKeywordInput($event)">
          </mat-chip-list>
        </mat-form-field>

        <button mat-raised-button color="primary" class="" (click)="graphAggregation()">Search</button>
        <button mat-raised-button color="accent" (click)="downloadAggregation()">Download</button>
      </div>

      <!-- <ng-template #noError> -->
        <div class="inner-container">
          <mat-card>
            Graph of the number of entries that contain the given search words by western year.
            <!-- Examples to try: 鳥銃, 火藥, 焰硝 -->
          </mat-card>
        </div>

        <ng-template [ngIf]="isFetching" [ngIfElse]="loaded">
          <mat-spinner class="center"></mat-spinner>
        </ng-template>
        <ng-template #loaded>
          <aggregation-graph [aggregationOutput]=keywordOutput ></aggregation-graph>
          <aggregation-graph [aggregationOutput]=recordRatioOutput ></aggregation-graph>
          <aggregation-graph [aggregationOutput]=recordCountOutput ></aggregation-graph>
        </ng-template>

</div>
