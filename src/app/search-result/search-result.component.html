<div class="inner-container" *ngFor="let record of searchResults">
  <a class="record-entity" [routerLink]="['/record', record.id]">
  <mat-card id={{record.id}}>
    <mat-card-header>
      <mat-card-title>{{record.title}}</mat-card-title>
      <mat-card-subtitle>
          {{record.recordType}}  {{record.year}}-{{record.month}}-{{record.day}} 
          {{record.bookName}} V.{{record.bookVolume}}.{{record.bookNumber}}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content #content>
      {{record.content}}
    </mat-card-content>
  </mat-card>
  </a>
</div>
