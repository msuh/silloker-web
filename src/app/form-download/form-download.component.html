<form class="form-wangjo-download form-download">
  <div class="form-group row">
      <label for="book" class="col-sm-4 col-form-label">Book Name</label>
      <div class="col-sm-8">
        <input type="text" class="form-control" id="wangjo_book" placeholder="太祖實錄">
      </div>
  </div>
  <div class="form-group row">
    <label for="volume" class="col-sm-4 col-form-label">Book Volume</label>
    <div class="col-sm-8">
      <input type="text" class="form-control" id="wangjo_volume" placeholder="1">
    </div>
  </div>
  <div class="form-group row">
     <label for="docSeqNum" class="col-sm-4 col-form-label">Book Number</label>
     <div class="col-sm-8">
       <input type="text" class="form-control" id="wangjo_sequence" placeholder="150">
     </div>
  </div>
  <div class="form-group row">
     <label for="title" class="col-sm-4 col-form-label">Title</label>
     <div class="col-sm-8">
       <input type="text" class="form-control" id="wangjo_title" placeholder="癸未九月十八日">
     </div>
  </div>
  <div class="form-group row">
       <label for="year" class="col-sm-4 col-form-label">Written Year</label>
       <div class="col-sm-8">
         <input type="text" class="form-control" id="wangjo_year" placeholder="1600">
       </div>
  </div>
  <div class="form-group row">
       <label for="month" class="col-sm-4 col-form-label">Written Month</label>
       <div class="col-sm-8">
         <input type="text" class="form-control" id="wangjo_month" placeholder="6">
       </div>
  </div>
  <div class="form-group row">
       <label for="day" class="col-sm-4 col-form-label">Written Day</label>
       <div class="col-sm-8">
         <input type="text" class="form-control" id="wangjo_day" placeholder="10">
       </div>
  </div>
  <div class="form-group row">
         <label for="content" class="col-sm-4 col-form-label">Content Keyword</label>
         <div class="col-sm-8">
           <input type="text" class="form-control" id="wangjo_content" placeholder="進取京城">
         </div>
  </div>
</form>
