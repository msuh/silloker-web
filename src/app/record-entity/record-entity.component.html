<mat-card>
    <mat-card-header>
      <mat-card-title>{{record.title}}</mat-card-title>
      <mat-card-subtitle>
          {{record.recordType}}  {{record.year}}-{{record.month}}-{{record.day}} 
      </mat-card-subtitle>
      <mat-card-subtitle>
          {{record.bookName}} V.{{record.bookVolume}}.{{record.bookNumber}}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content #content>
      {{record.content}}
    </mat-card-content>
    <mat-card-content>
      <mat-divider inset></mat-divider>

      <table mat-table [dataSource]="tags" class="mat-elevation-z8">
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef> Category </th>
          <td mat-cell *matCellDef="let tag"> {{tag.tagName}} </td>
        </ng-container>

        <ng-container matColumnDef="tag">
          <th mat-header-cell *matHeaderCellDef> Tag </th>
          <td mat-cell *matCellDef="let tag"> {{tag.tagContent}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
    
</mat-card>
